<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: -apple-system, sans-serif; width: 280px; padding: 16px; margin: 0; color: #333; }
        h2 { margin-top: 0; font-size: 16px; text-align: center; }
        p { font-size: 13px; color: #666; margin-bottom: 16px; text-align: center; }
        button { width: 100%; padding: 10px; background-color: #0052cc; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #0043a6; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        #status { margin-top: 12px; font-size: 13px; font-weight: bold; text-align: center; }
        .success { color: #00875a; }
        .error { color: #de350b; }
    </style>
</head>
<body>
    <h2>TA Progress Sync</h2>
    <p>Your progress syncs automatically in the background.</p>
    
    <button id="syncBtn">Sync Now</button>
    <div id="status"></div>

    <script src="popup.js"></script>
</body>
</html>
